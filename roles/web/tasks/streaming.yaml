---
# Anarres :: web :: streaming
#
# Install and configure streaming-related apps.
#
# These tasks are only included when the "streaming" tag is explicitly included with "-t streaming".
- name: Install apps for streaming
  community.general.pacman:
    name:
      - cameractrls
      - obs-studio
      - v4l2loopback-dkms
    state: latest
  when: ansible_os_family == "Archlinux"
  become: true
